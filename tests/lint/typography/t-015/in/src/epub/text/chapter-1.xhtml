		<section id="chapter-1" epub:type="chapter">
			<h2 epub:type="z3998:ordinal z3998:roman">I</h2>
			<!-- Ungrouped integers require commas. -->
			<p>It is 1000 inches long.</p>
			<p>It is 12345 feet long.</p>
			<p>It is 1000°.</p>
			<p>It costs £1000.</p>
			<p>It costs $1000.</p>
			<!-- Fractional digits do not require commas, regardless of their number. -->
			<p>It is 3.8790 inches long.</p>
			<p>It is 3.87902 inches long.</p>
			<p>It is 3.879020 inches long.</p>
			<p>It is 3.87902°.</p>
			<!-- Grouped integers already have commas. -->
			<p>It is 1,000 inches long.</p>
		</section>
	</body>
